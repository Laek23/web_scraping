services:
  - type: web
    name: webscrap-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Maxun
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: webscrap-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"

databases:
  - name: webscrap-db
    databaseName: webscrap
    user: webscrap
    plan: free
